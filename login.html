<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Escola Cloud</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-container {
        max-width: 400px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
      }
      .perfil-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .perfil-btn {
        flex: 1;
        padding: 10px;
        background: #f0f0f0;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .perfil-btn.active {
        background: #667eea;
        color: white;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
      }
      .btn-entrar {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="header" style="padding: 20px">
        <h2>🔐 FAZER LOGIN</h2>
      </div>

      <div class="perfil-buttons">
        <button class="perfil-btn" data-perfil="dono">👑 Dono</button>
        <button class="perfil-btn" data-perfil="diretor">👔 Diretor</button>
        <button class="perfil-btn" data-perfil="professor">👨‍🏫 Professor</button>
        <button class="perfil-btn" data-perfil="secretario">
          📋 Secretário
        </button>
        <button class="perfil-btn active" data-perfil="aluno">👨‍🎓 Aluno</button>
      </div>

      <!-- Formulário para cada perfil -->
      <div class="form-container" id="form-dono" class="hidden">
        <div class="form-group">
          <input type="email" placeholder="E-mail" />
        </div>
        <div class="form-group">
          <input type="password" placeholder="Senha" />
        </div>
        <button class="btn-entrar">Entrar</button>
      </div>
      <!-- (os outros perfis são similares) -->
      <div id="form-aluno">
        <div class="form-group">
          <input type="text" placeholder="Matrícula ou E-mail" />
        </div>
        <div class="form-group">
          <input type="password" placeholder="Senha" />
        </div>
        <button class="btn-entrar">Entrar</button>
      </div>
    </div>

    <script>
      document.querySelectorAll(".perfil-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".perfil-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          // Aqui você esconde/mostra os formulários
        });
      });
    </script>
  </body>
</html>
